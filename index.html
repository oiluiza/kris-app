<h1>Kris</h1>
<p>Kris is a private, single-user personal assistant that runs on its owner's own computer. It helps organize the owner's own Google Calendar, Gmail, Drive, Docs and Sheets.</p>
<p>It is not a public service: it has no other users, no sign-up and no server of its own.</p>
